<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory &mdash; Vantage Shipment Tracker (Demo)</title>
<meta name="description" content="Per market gear inventory: ordered, arrived, in transit and in production. Sample data only.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="bg-purple-700 text-white text-center text-xs font-semibold px-4 py-2">
  PORTFOLIO DEMO &middot; every figure on this page is generated sample data &mdash; no real customer, order or shipment is shown
</div>
<nav class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between flex-wrap gap-3">
  <div class="flex items-center gap-2 text-gray-900 font-bold text-lg">
    <span class="text-2xl">&#128230;</span>
    <span>Vantage Shipment Tracker</span>
    <span class="ml-2 text-xs font-medium bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full">Demo</span>
  </div>
  <div class="flex items-center gap-5 text-sm text-gray-500">
    <a href="index.html" class="flex items-center gap-1 hover:text-purple-700 transition-colors">&#128202; Dashboard</a>
    <a href="tracking.html" class="flex items-center gap-1 hover:text-purple-700 transition-colors">&#128666; Tracking</a>
    <a href="orders.html" class="flex items-center gap-1 hover:text-purple-700 transition-colors">&#128451; Orders</a>
    <a href="calendar.html" class="flex items-center gap-1 hover:text-purple-700 transition-colors">&#128197; Calendar</a>
    <span class="text-gray-900 font-semibold flex items-center gap-1 border-b-2 border-purple-600 pb-0.5">&#128230; Inventory</span>
  </div>
</nav>
<main class="max-w-6xl mx-auto px-6 py-8">

<div class="flex items-center justify-between mb-6 flex-wrap gap-3">
  <div>
    <h1 class="text-2xl font-bold text-gray-900">Inventory</h1>
    <p class="text-sm text-gray-400 mt-1" id="count-label">Loading&hellip;</p>
  </div>
  <div id="market-filter" class="flex flex-wrap rounded-xl border border-gray-200 overflow-hidden text-sm font-semibold"></div>
</div>
<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6" id="tiles"></div>
<div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
  <div class="overflow-x-auto">
    <table class="w-full text-sm">
      <thead>
        <tr class="bg-gray-50 text-gray-500 text-xs font-semibold uppercase tracking-wide">
          <th class="px-5 py-3 text-left">Market</th>
          <th class="px-4 py-3 text-left">Item</th>
          <th class="px-4 py-3 text-center">Ordered</th>
          <th class="px-4 py-3 text-center text-green-600">Arrived</th>
          <th class="px-4 py-3 text-center text-orange-500">In transit</th>
          <th class="px-4 py-3 text-center text-gray-500">In production</th>
          <th class="px-4 py-3 text-center text-red-600">Issues</th>
          <th class="px-4 py-3 text-left w-40">Progress</th>
        </tr>
      </thead>
      <tbody id="rows" class="divide-y divide-gray-100"></tbody>
    </table>
  </div>
</div>

</main>
<script src="data.js"></script>
<script>

let _m='All';
const u=n=>n.toLocaleString();
function buildFilter(){
  const markets=['All',...Object.keys(DEMO.markets).sort()];
  const w=document.getElementById('market-filter'); w.innerHTML='';
  markets.forEach(m=>{
    const b=document.createElement('button'); b.textContent=m;
    b.className = m===_m ? 'px-4 py-2 bg-purple-600 text-white' : 'px-4 py-2 bg-white text-gray-600 hover:bg-gray-50';
    b.onclick=()=>{_m=m; buildFilter(); render();};
    w.appendChild(b);
  });
}
function render(){
  const markets = _m==='All' ? Object.keys(DEMO.markets) : [_m];
  let rows=[], t={total:0,arrived:0,shipped:0,prod:0,err:0};
  markets.sort().forEach(m=>{
    DEMO.markets[m].gear.forEach(g=>{
      rows.push({market:m, ...g});
      t.total+=g.total; t.arrived+=g.arrived; t.shipped+=g.shipped; t.prod+=g.in_production; t.err+=g.error||0;
    });
  });
  document.getElementById('count-label').textContent =
    rows.length+' item lines across '+markets.length+' market'+(markets.length===1?'':'s');
  const tiles=[['Total units',u(t.total),'text-gray-900'],['Arrived',u(t.arrived),'text-green-600'],
               ['In transit',u(t.shipped),'text-orange-500'],['In production',u(t.prod),'text-gray-500']];
  document.getElementById('tiles').innerHTML = tiles.map(([l,v,c])=>
    `<div class="bg-white rounded-2xl border border-gray-200 shadow-sm px-5 py-4">
       <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">${l}</p>
       <p class="text-2xl font-bold ${c}">${v}</p></div>`).join('');
  document.getElementById('rows').innerHTML = rows.map(r=>{
    const ap=r.total?Math.round(r.arrived/r.total*100):0;
    const sp=r.total?Math.round(r.shipped/r.total*100):0;
    const ip=r.total?Math.round(r.in_production/r.total*100):0;
    return `<tr class="hover:bg-gray-50">
      <td class="px-5 py-3 font-semibold text-gray-800">${r.market}</td>
      <td class="px-4 py-3 text-gray-600">${r.gear_type}</td>
      <td class="px-4 py-3 text-center text-gray-700 font-semibold">${u(r.total)}</td>
      <td class="px-4 py-3 text-center text-green-600">${u(r.arrived)}</td>
      <td class="px-4 py-3 text-center text-orange-500">${u(r.shipped)}</td>
      <td class="px-4 py-3 text-center text-gray-500">${u(r.in_production)}</td>
      <td class="px-4 py-3 text-center ${r.error?'text-red-600 font-semibold':'text-gray-300'}">${r.error?u(r.error):'0'}</td>
      <td class="px-4 py-3">
        <div class="h-2 bg-gray-100 rounded-full overflow-hidden flex">
          ${ap?`<div class="h-full bg-green-500" style="width:${ap}%"></div>`:''}
          ${sp?`<div class="h-full bg-orange-400" style="width:${sp}%"></div>`:''}
          ${ip?`<div class="h-full bg-gray-300" style="width:${ip}%"></div>`:''}
        </div>
      </td>
    </tr>`;}).join('');
}
buildFilter(); render();

</script>
</body>
</html>
