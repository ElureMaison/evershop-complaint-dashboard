<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracking &mdash; Vantage Shipment Tracker (Demo)</title>
<meta name="description" content="Shipment tracking across FedEx, UPS and AfterShip. Sample data only.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="bg-purple-700 text-white text-center text-xs font-semibold px-4 py-2">
  PORTFOLIO DEMO &middot; every figure on this page is generated sample data &mdash; no real customer, order or shipment is shown
</div>
<nav class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between flex-wrap gap-3">
  <div class="flex items-center gap-2 text-gray-900 font-bold text-lg">
    <span class="text-2xl">&#128230;</span>
    <span>Vantage Shipment Tracker</span>
    <span class="ml-2 text-xs font-medium bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full">Demo</span>
  </div>
  <div class="flex items-center gap-5 text-sm text-gray-500">
    <a href="index.html" class="flex items-center gap-1 hover:text-purple-700 transition-colors">&#128202; Dashboard</a>
    <span class="text-gray-900 font-semibold flex items-center gap-1 border-b-2 border-purple-600 pb-0.5">&#128666; Tracking</span>
    <a href="orders.html" class="flex items-center gap-1 hover:text-purple-700 transition-colors">&#128451; Orders</a>
    <a href="calendar.html" class="flex items-center gap-1 hover:text-purple-700 transition-colors">&#128197; Calendar</a>
    <a href="inventory.html" class="flex items-center gap-1 hover:text-purple-700 transition-colors">&#128230; Inventory</a>
  </div>
</nav>
<main class="max-w-6xl mx-auto px-6 py-8">

<div class="flex items-center justify-between mb-6 flex-wrap gap-3">
  <div>
    <h1 class="text-2xl font-bold text-gray-900">Tracking</h1>
    <p class="text-sm text-gray-400 mt-1" id="count-label">Loading&hellip;</p>
  </div>
  <div id="status-filter" class="flex rounded-xl border border-gray-200 overflow-hidden text-sm font-semibold"></div>
</div>
<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6" id="tiles"></div>
<div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
  <div class="overflow-x-auto">
    <table class="w-full text-sm">
      <thead>
        <tr class="bg-gray-50 text-gray-500 text-xs font-semibold uppercase tracking-wide">
          <th class="px-5 py-3 text-left">Order</th>
          <th class="px-4 py-3 text-left">Item</th>
          <th class="px-4 py-3 text-center">Qty</th>
          <th class="px-4 py-3 text-left">Carrier</th>
          <th class="px-4 py-3 text-left">Tracking number</th>
          <th class="px-4 py-3 text-left">Status</th>
          <th class="px-4 py-3 text-center">Last scan</th>
        </tr>
      </thead>
      <tbody id="rows" class="divide-y divide-gray-100"></tbody>
    </table>
  </div>
</div>

</main>
<script src="data.js"></script>
<script>

let _filter='All';
const STATUSES=['All','In Transit','Out for Delivery','Delivered','Exception'];
const pill=s=>({'In Transit':'bg-orange-50 text-orange-600','Out for Delivery':'bg-blue-50 text-blue-600',
  'Delivered':'bg-green-50 text-green-700','Exception':'bg-red-50 text-red-600'}[s]||'bg-gray-100 text-gray-600');
const fmt=d=>new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
function buildFilter(){
  const w=document.getElementById('status-filter'); w.innerHTML='';
  STATUSES.forEach(s=>{
    const b=document.createElement('button'); b.textContent=s;
    b.className = s===_filter ? 'px-4 py-2 bg-purple-600 text-white' : 'px-4 py-2 bg-white text-gray-600 hover:bg-gray-50';
    b.onclick=()=>{_filter=s; buildFilter(); render();};
    w.appendChild(b);
  });
}
function render(){
  const all=DEMO.tracking;
  const rows = _filter==='All' ? all : all.filter(r=>r.status===_filter);
  document.getElementById('count-label').textContent =
    rows.length + ' of ' + all.length + ' shipments' + (_filter==='All'?'':' · '+_filter);
  const counts={};
  STATUSES.slice(1).forEach(s=>counts[s]=all.filter(r=>r.status===s).length);
  document.getElementById('tiles').innerHTML = Object.entries(counts).map(([s,n])=>
    `<div class="bg-white rounded-2xl border border-gray-200 shadow-sm px-5 py-4">
       <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-1">${s}</p>
       <p class="text-2xl font-bold text-gray-900">${n}</p>
       <p class="text-xs text-gray-400 mt-0.5">shipments</p></div>`).join('');
  document.getElementById('rows').innerHTML = rows.length ? rows.map(r=>
    `<tr class="hover:bg-gray-50">
      <td class="px-5 py-3 font-semibold text-gray-800">${r.label}</td>
      <td class="px-4 py-3 text-gray-600">${r.gear_type}</td>
      <td class="px-4 py-3 text-center text-gray-500">${r.qty.toLocaleString()}</td>
      <td class="px-4 py-3 text-gray-600">${r.carrier}</td>
      <td class="px-4 py-3"><span class="font-mono text-xs text-gray-500">${r.tn}</span></td>
      <td class="px-4 py-3"><span class="text-xs font-semibold px-2 py-1 rounded-full ${pill(r.status)}">${r.status}</span></td>
      <td class="px-4 py-3 text-center text-gray-500">${fmt(r.last_update)}</td>
    </tr>`).join('') : '<tr><td colspan="7" class="px-6 py-10 text-center text-gray-400 text-sm">No shipments with this status.</td></tr>';
}
buildFilter(); render();

</script>
</body>
</html>
