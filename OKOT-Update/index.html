<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>OKOT Updates</title>
<style>
:root{
  color-scheme: light;
  --ui: system-ui, -apple-system, "Segoe UI", sans-serif;
  --plane:#f9f9f7; --surface:#fcfcfb;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,0.10);
  --s-gmail:#2a78d6; --s-monday:#eb6834; --s-trello:#1baf7a;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-ink:#006300;
  --wash:rgba(11,11,11,0.035);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19;
    --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,0.10);
    --s-gmail:#3987e5; --s-monday:#d95926; --s-trello:#199e70;
    --good-ink:#0ca30c;
    --wash:rgba(255,255,255,0.045);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0d0d0d; --surface:#1a1a19;
  --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,0.10);
  --s-gmail:#3987e5; --s-monday:#d95926; --s-trello:#199e70;
  --good-ink:#0ca30c;
  --wash:rgba(255,255,255,0.045);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--plane);color:var(--ink-1);font:15px/1.55 var(--ui);
     -webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 72px}

/* ---------------- gate ---------------- */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.gatecard{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--ring);
          border-radius:10px;padding:26px}
.gatecard h1{margin:0 0 4px;font-size:19px;letter-spacing:-0.01em}
.gatecard p{margin:0 0 18px;color:var(--ink-2);font-size:13px}
.pwrow{display:flex;gap:8px}
.pwrow input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--axis);border-radius:7px;
             background:var(--plane);color:var(--ink-1);font:14px var(--ui)}
.pwrow input:focus{outline:2px solid var(--s-gmail);outline-offset:1px;border-color:transparent}
.btn{padding:10px 15px;border:1px solid var(--axis);border-radius:7px;background:var(--surface);
     color:var(--ink-1);font:600 13px var(--ui);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--wash)}
.btn.primary{background:var(--s-gmail);border-color:var(--s-gmail);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
#gateErr{margin:10px 0 0;color:var(--critical);font-size:13px;min-height:18px}

/* ---------------- header ---------------- */
header{border-bottom:1px solid var(--ring);background:var(--surface);margin-bottom:22px}
.hbar{max-width:1080px;margin:0 auto;padding:16px;display:flex;align-items:center;
      gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.brand b{font-size:17px;letter-spacing:-0.01em}
.brand span{font-size:12px;color:var(--ink-3)}
.hactions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stamp{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ---------------- week tabs ---------------- */
.weeks{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px;
       scrollbar-width:thin}
.wk{flex:0 0 auto;padding:8px 13px;border:1px solid var(--ring);border-radius:999px;
    background:var(--surface);color:var(--ink-2);font:600 13px var(--ui);cursor:pointer;
    white-space:nowrap}
.wk:hover{background:var(--wash)}
.wk[aria-pressed="true"]{background:var(--ink-1);border-color:var(--ink-1);color:var(--plane)}
.wk .sub{font-weight:400;opacity:.72;margin-left:5px;font-size:12px}

/* ---------------- headline ---------------- */
.headline{background:var(--surface);border:1px solid var(--ring);border-radius:10px;
          padding:20px 22px;margin-bottom:18px}
.headline .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;
                   color:var(--ink-3);margin-bottom:7px}
.headline .lede{font-size:21px;line-height:1.35;letter-spacing:-0.015em;margin:0}
.headline .range{margin:9px 0 0;font-size:13px;color:var(--ink-2)}

/* ---------------- stat tiles ---------------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;
       margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--ring);border-radius:10px;padding:15px 16px}
.tile .k{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);
         display:flex;align-items:center;gap:6px;margin-bottom:8px}
.tile .v{font-size:30px;line-height:1;letter-spacing:-0.02em}
.tile .d{margin-top:7px;font-size:12px;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.tile.alert{border-color:var(--critical)}
.tile.alert .v{color:var(--critical)}

/* ---------------- panels ---------------- */
.panel{background:var(--surface);border:1px solid var(--ring);border-radius:10px;
       margin-bottom:18px;overflow:hidden}
.phead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--ring);
       flex-wrap:wrap}
.phead h2{margin:0;font-size:14px;letter-spacing:-0.005em;display:flex;align-items:center;gap:8px}
.phead .count{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.phead .spacer{margin-left:auto}
.pbody{padding:6px 18px 16px}
.empty{padding:20px 18px;color:var(--ink-3);font-size:13px}

/* ---------------- chart ---------------- */
.chartwrap{padding:16px 18px 10px}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:0 18px 14px}
.legend span{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2)}
svg{display:block;width:100%;height:auto;overflow:visible}
.tick{font:11px var(--ui);fill:var(--ink-3)}
.vlab{font:600 10px var(--ui);fill:var(--ink-2)}
table.dt{width:100%;border-collapse:collapse;font-size:13px;
         font-variant-numeric:tabular-nums}
table.dt th,table.dt td{padding:7px 10px;border-bottom:1px solid var(--grid);text-align:right}
table.dt th:first-child,table.dt td:first-child{text-align:left}
table.dt th{color:var(--ink-3);font-weight:600;font-size:11px;letter-spacing:.05em;
            text-transform:uppercase}

/* ---------------- item rows ---------------- */
.row{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--grid)}
.row:last-child{border-bottom:0}
.row .stripe{width:3px;border-radius:2px;flex:0 0 auto;align-self:stretch}
.row .body{min-width:0;flex:1}
.row .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:3px}
.row .title{font-weight:600;font-size:14px;letter-spacing:-0.005em;word-break:break-word}
.row .title a{text-decoration:none}
.row .title a:hover{text-decoration:underline}
.row .when{font-size:12px;color:var(--ink-3);margin-left:auto;white-space:nowrap;
           font-variant-numeric:tabular-nums}
.row .meta{font-size:12.5px;color:var(--ink-2);word-break:break-word}
.row .snip{font-size:12.5px;color:var(--ink-3);margin-top:4px;line-height:1.5;
           display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;
      border:1px solid var(--ring);font-size:11px;color:var(--ink-2);white-space:nowrap}
.chip.hot{border-color:var(--critical);color:var(--critical)}
.chip.warn{border-color:var(--serious);color:var(--serious)}
.chip.ok{border-color:var(--good);color:var(--good-ink)}
.grp{margin:14px 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
     color:var(--ink-3)}

/* ---------------- source status ---------------- */
.srcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.src{border:1px solid var(--ring);border-radius:9px;padding:13px 14px;background:var(--plane)}
.src .n{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;margin-bottom:5px}
.src .s{font-size:12px;color:var(--ink-2)}
.src .e{font-size:11.5px;color:var(--critical);margin-top:5px;word-break:break-word}

.note{font-size:12px;color:var(--ink-3);padding:0 2px;margin-top:-6px;margin-bottom:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:50;
       background:var(--ink-1);color:var(--plane);padding:10px 17px;border-radius:8px;
       font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.22);opacity:0;pointer-events:none;
       transition:opacity .18s}
.toast.on{opacity:1}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;
      border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;
      vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:560px){
  .headline .lede{font-size:18px}
  .tile .v{font-size:26px}
  .row .when{margin-left:0}
}
</style>
</head>
<body>

<div id="gate">
  <div class="gatecard">
    <h1>OKOT Updates</h1>
    <p>Weekly digest for Outdoor Kids OT. The report is encrypted; the password decrypts it in your browser.</p>
    <div class="pwrow">
      <input id="gatePw" type="password" autocomplete="current-password" placeholder="Password"
             aria-label="Password">
      <button class="btn primary" id="gateBtn" type="button">Open</button>
    </div>
    <p id="gateErr" role="alert"></p>
  </div>
</div>

<div id="app" hidden>
<header>
  <div class="hbar">
    <div class="brand">
      <b>OKOT Updates</b>
      <span>Outdoor Kids OT &middot; Gmail, Monday &amp; Trello</span>
    </div>
    <div class="hactions">
      <span class="stamp" id="stamp">&nbsp;</span>
      <button class="btn" id="themeBtn" type="button" title="Toggle dark mode">Theme</button>
      <button class="btn primary" id="refreshBtn" type="button">Refresh</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="weeks" id="weeks" role="group" aria-label="Reporting week"></div>
  <div id="main"></div>

  <div class="panel">
    <div class="phead"><h2>Connections</h2></div>
    <div class="pbody"><div class="srcs" id="srcs"></div></div>
  </div>
</div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ============ gate ============
   The password is the decryption key, not a checked value. The published
   data file is AES-256-GCM ciphertext, so a wrong password fails to decrypt
   rather than failing a comparison — there is nothing to read past the gate.
   The key is held in memory only, never stored. */
var GK = 'okot_updates_pw_v1';
var gate=document.getElementById('gate'), app=document.getElementById('app');
var pw=document.getElementById('gatePw'), gateBtn=document.getElementById('gateBtn');
var KEY=null, PASSWORD=null;

function b64(s){
  var bin=atob(s), out=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
function deriveKey(password, env){
  return crypto.subtle.importKey('raw', new TextEncoder().encode(password),
                                 'PBKDF2', false, ['deriveKey'])
    .then(function(base){
      return crypto.subtle.deriveKey(
        {name:'PBKDF2', salt:b64(env.salt), iterations:env.iterations, hash:'SHA-256'},
        base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    });
}
function decrypt(env, key){
  return crypto.subtle.decrypt({name:'AES-GCM', iv:b64(env.iv)}, key, b64(env.ct))
    .then(function(buf){ return JSON.parse(new TextDecoder().decode(buf)); });
}
function fetchEnvelope(bust){
  var url='data.json' + (bust ? ('?t='+Date.now()) : '');
  return fetch(url,{cache: bust?'reload':'default'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); });
}

function tryUnlock(){
  var err=document.getElementById('gateErr');
  var value=pw.value;
  if(!value){ err.textContent='Enter the password.'; return; }
  gateBtn.disabled=true; gateBtn.innerHTML='<span class="spin"></span>Opening';
  err.textContent='';
  fetchEnvelope(false)
    .then(function(env){
      return deriveKey(value, env).then(function(key){
        return decrypt(env, key).then(function(json){
          KEY=key; PASSWORD=value; DATA=json; WEEK=json.current_week;
          try{sessionStorage.setItem(GK, value);}catch(e){}
          gate.hidden=true; gate.style.display='none'; app.hidden=false;
          render();
        });
      });
    })
    .catch(function(e){
      // A GCM failure and a bad password are the same event here.
      err.textContent = /HTTP/.test(e.message)
        ? 'Could not load the data file ('+e.message+').'
        : 'Incorrect password.';
      pw.select();
    })
    .finally(function(){ gateBtn.disabled=false; gateBtn.textContent='Open'; });
}
gateBtn.addEventListener('click',tryUnlock);
pw.addEventListener('keydown',function(e){if(e.key==='Enter')tryUnlock();});
pw.addEventListener('input',function(){document.getElementById('gateErr').textContent='';});
// Within a tab, don't re-ask; a new tab or window starts locked again.
var saved=null; try{saved=sessionStorage.getItem(GK);}catch(e){}
if(saved){ pw.value=saved; tryUnlock(); } else { pw.focus(); }

/* ============ theme ============ */
var tBtn=document.getElementById('themeBtn');
try{var sv=localStorage.getItem('okot_theme'); if(sv)document.documentElement.setAttribute('data-theme',sv);}catch(e){}
tBtn.addEventListener('click',function(){
  var cur=document.documentElement.getAttribute('data-theme');
  var next = cur==='dark' ? 'light' : cur==='light' ? 'dark'
           : (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('okot_theme',next);}catch(e){}
  if(DATA) render();
});

/* ============ helpers ============ */
var SRC = {
  gmail:  {label:'Gmail',  color:'var(--s-gmail)'},
  monday: {label:'Monday', color:'var(--s-monday)'},
  trello: {label:'Trello', color:'var(--s-trello)'}
};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function el(html){var d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
function plural(n,one,many){return n+' '+(n===1?one:(many||one+'s'));}

function when(iso){
  if(!iso) return '';
  var d=new Date(iso), now=new Date();
  var mins=Math.round((now-d)/60000);
  if(mins<1) return 'just now';
  if(mins<60) return mins+'m ago';
  if(mins<24*60) return Math.round(mins/60)+'h ago';
  var days=Math.round(mins/1440);
  if(days<7) return days+'d ago';
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
function clock(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleString(undefined,
    {weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
}

/* ============ data ============ */
var DATA=null, WEEK=null;

// Refresh re-fetches the envelope and decrypts it with the password already
// in hand, so a rebuild published since load is picked up without re-asking.
var rBtn=document.getElementById('refreshBtn');
rBtn.addEventListener('click',function(){
  rBtn.disabled=true; rBtn.innerHTML='<span class="spin"></span>Refreshing';
  fetchEnvelope(true)
    .then(function(env){
      // A rebuild re-salts, so the key is derived again rather than reused.
      return deriveKey(PASSWORD, env).then(function(key){
        return decrypt(env, key).then(function(j){
          var changed = !DATA || j.generated_at !== DATA.generated_at;
          KEY=key; DATA=j; if(!DATA.data[WEEK]) WEEK=j.current_week;
          render();
          toast(changed ? 'Updated — data from '+clock(j.generated_at)
                        : 'Already current as of '+clock(j.generated_at));
        });
      });
    })
    .catch(function(err){ toast('Refresh failed: '+err.message); })
    .finally(function(){ rBtn.disabled=false; rBtn.textContent='Refresh'; });
});

var tEl=document.getElementById('toast'), tTimer=null;
function toast(msg){
  tEl.textContent=msg; tEl.classList.add('on');
  clearTimeout(tTimer); tTimer=setTimeout(function(){tEl.classList.remove('on');},3600);
}

/* ============ render ============ */
function render(){
  renderStamp(); renderWeeks(); renderMain(); renderSrcs();
}

function renderStamp(){
  document.getElementById('stamp').textContent =
    DATA.generated_at ? 'Data as of '+clock(DATA.generated_at) : '';
}

function renderWeeks(){
  var host=document.getElementById('weeks'); host.innerHTML='';
  DATA.weeks.forEach(function(w){
    var b=el('<button class="wk" type="button"></button>');
    b.setAttribute('aria-pressed', String(w.start===WEEK));
    b.innerHTML = esc(w.is_current ? 'This week' : w.label) +
                  '<span class="sub">'+esc(w.label+' – '+w.end_label)+'</span>';
    b.addEventListener('click',function(){WEEK=w.start;render();
      window.scrollTo({top:0,behavior:'smooth'});});
    host.appendChild(b);
  });
}

function renderMain(){
  var wk = DATA.data[WEEK] || {gmail:[],monday:[],trello:[],insights:{}};
  var ins = wk.insights || {}, c = ins.counts || {};
  var meta = DATA.weeks.filter(function(w){return w.start===WEEK;})[0] || {};
  var host=document.getElementById('main'); host.innerHTML='';

  /* headline */
  host.appendChild(el(
    '<div class="headline">'+
      '<div class="eyebrow">'+esc(meta.is_current?'This reporting week':'Week of '+meta.label)+'</div>'+
      '<p class="lede">'+esc(ins.headline||'No activity recorded this week')+'</p>'+
      '<p class="range">Wednesday '+esc(meta.label||'')+' &ndash; '+esc(meta.end_label||'')+
      (DATA.redacted?' &middot; email addresses are masked on this page':'')+'</p>'+
    '</div>'));

  /* tiles */
  var tiles=[
    {k:'Emails in', v:c.email_in||0, c:'var(--s-gmail)',
     d: plural(c.email_out||0,'reply','replies')+' sent'},
    {k:'Awaiting reply', v:c.needs_reply||0, c:'var(--critical)', alert:(c.needs_reply||0)>0,
     d:(c.needs_reply||0)?'oldest first, below':'inbox is clear'},
    {k:'Monday', v:(c.monday_items||0)+(c.monday_comments||0), c:'var(--s-monday)',
     d:(c.monday_new||0)+' new · '+plural(c.monday_comments||0,'comment')},
    {k:'Trello', v:c.trello_actions||0, c:'var(--s-trello)',
     d:(c.trello_new_cards||0)+' new · '+(c.trello_moves||0)+' moved'}
  ];
  var grid=el('<div class="tiles"></div>');
  tiles.forEach(function(t){
    grid.appendChild(el(
      '<div class="tile'+(t.alert?' alert':'')+'">'+
        '<div class="k"><span class="dot" style="background:'+t.c+'"></span>'+esc(t.k)+'</div>'+
        '<div class="v">'+t.v+'</div>'+
        '<div class="d">'+esc(t.d)+'</div>'+
      '</div>'));
  });
  host.appendChild(grid);

  host.appendChild(chartPanel(wk, meta));
  host.appendChild(replyPanel(ins));
  host.appendChild(duePanel(ins));
  host.appendChild(mondayPanel(wk.monday||[]));
  host.appendChild(trelloPanel(wk.trello||[]));
  host.appendChild(mailPanel(wk.gmail||[]));
}

/* ---- daily activity chart: grouped bars, 3 series ---- */
function chartPanel(wk, meta){
  var start = new Date(WEEK+'T00:00:00');
  var days=[], i;
  for(i=0;i<7;i++){
    var d=new Date(start); d.setDate(start.getDate()+i);
    days.push({d:d, key:d.toISOString().slice(0,10),
               lab:d.toLocaleDateString(undefined,{weekday:'short'}),
               gmail:0, monday:0, trello:0});
  }
  function tally(list, key){
    (list||[]).forEach(function(it){
      var k=(it.when||'').slice(0,10);
      for(var j=0;j<7;j++) if(days[j].key===k){days[j][key]++;break;}
    });
  }
  tally(wk.gmail,'gmail'); tally(wk.monday,'monday'); tally(wk.trello,'trello');

  var max=1;
  days.forEach(function(d){max=Math.max(max,d.gmail,d.monday,d.trello);});
  var total=0; days.forEach(function(d){total+=d.gmail+d.monday+d.trello;});

  var W=880,H=210, padL=34,padR=10,padT=16,padB=28;
  var plotW=W-padL-padR, plotH=H-padT-padB;
  var slot=plotW/7, bw=Math.min(16,(slot-16)/3), gap=2;
  var keys=['gmail','monday','trello'];

  var svg=['<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Daily activity by source">'];
  /* gridlines */
  var steps=Math.min(4,max);
  for(i=0;i<=steps;i++){
    var v=Math.round(max*i/steps), y=padT+plotH-(v/max)*plotH;
    svg.push('<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+
             '" stroke="var(--grid)" stroke-width="1"/>');
    svg.push('<text class="tick" x="'+(padL-8)+'" y="'+(y+4)+'" text-anchor="end">'+v+'</text>');
  }
  days.forEach(function(d,di){
    var x0=padL+di*slot+(slot-(bw*3+gap*2))/2;
    keys.forEach(function(k,ki){
      var val=d[k]; if(!val) return;
      var h=Math.max(3,(val/max)*plotH);
      var x=x0+ki*(bw+gap), y=padT+plotH-h;
      svg.push('<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+
               '" rx="4" fill="var(--s-'+k+')"><title>'+esc(d.lab+' · '+SRC[k].label+': '+val)+
               '</title></rect>');
      if(val>=Math.max(2,max*0.28))
        svg.push('<text class="vlab" x="'+(x+bw/2)+'" y="'+(y-4)+'" text-anchor="middle">'+val+'</text>');
    });
    svg.push('<text class="tick" x="'+(padL+di*slot+slot/2)+'" y="'+(H-9)+
             '" text-anchor="middle">'+esc(d.lab)+'</text>');
  });
  svg.push('<line x1="'+padL+'" y1="'+(padT+plotH)+'" x2="'+(W-padR)+'" y2="'+(padT+plotH)+
           '" stroke="var(--axis)" stroke-width="1"/>');
  svg.push('</svg>');

  var rows=days.map(function(d){
    return '<tr><td>'+esc(d.lab)+'</td><td>'+d.gmail+'</td><td>'+d.monday+'</td><td>'+
           d.trello+'</td></tr>';}).join('');

  var p=el(
    '<div class="panel">'+
      '<div class="phead"><h2>Activity by day</h2>'+
        '<span class="count">'+plural(total,'event')+'</span>'+
        '<span class="spacer"></span>'+
        '<button class="btn" type="button" data-toggle>Table view</button>'+
      '</div>'+
      '<div class="chartwrap" data-chart>'+(total?svg.join(''):
        '<p class="empty" style="padding:6px 0">Nothing recorded on any source this week.</p>')+'</div>'+
      '<div class="legend">'+keys.map(function(k){
        return '<span><span class="dot" style="background:var(--s-'+k+')"></span>'+
               SRC[k].label+'</span>';}).join('')+'</div>'+
      '<div class="pbody" data-table hidden>'+
        '<table class="dt"><thead><tr><th>Day</th><th>Gmail</th><th>Monday</th>'+
        '<th>Trello</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '</div>');
  var btn=p.querySelector('[data-toggle]'), ch=p.querySelector('[data-chart]'),
      tb=p.querySelector('[data-table]');
  btn.addEventListener('click',function(){
    var showTable=tb.hidden;
    tb.hidden=!showTable; ch.hidden=showTable;
    btn.textContent=showTable?'Chart view':'Table view';
  });
  return p;
}

/* ---- needs a reply ---- */
function replyPanel(ins){
  var list=ins.needs_reply||[];
  var p=el('<div class="panel"><div class="phead">'+
           '<h2><span class="dot" style="background:var(--critical)"></span>Waiting on us</h2>'+
           '<span class="count">'+plural(list.length,'thread')+'</span></div>'+
           '<div class="pbody"></div></div>');
  var body=p.querySelector('.pbody');
  if(!list.length){
    body.innerHTML='<p class="empty" style="padding:14px 0">'+
      'Nothing unanswered — every inbound thread has a reply from OKOT after it.</p>';
    return p;
  }
  list.slice().sort(function(a,b){return new Date(a.when)-new Date(b.when);})
      .forEach(function(m){
    body.appendChild(el(
      '<div class="row">'+
        '<div class="stripe" style="background:var(--critical)"></div>'+
        '<div class="body">'+
          '<div class="top"><span class="title">'+esc(m.subject)+'</span>'+
            '<span class="when">'+esc(when(m.when))+'</span></div>'+
          '<div class="meta">'+esc(m.from)+' &middot; '+esc(m.addr)+
            ' &middot; <span class="chip">'+esc(m.category)+'</span>'+
            (m.thread_size>1?' <span class="chip">'+plural(m.thread_size,'message')+'</span>':'')+
          '</div>'+
          (m.snippet?'<div class="snip">'+esc(m.snippet)+'</div>':'')+
        '</div>'+
      '</div>'));
  });
  return p;
}

/* ---- due soon ---- */
function duePanel(ins){
  var list=ins.due_soon||[];
  if(!list.length) return document.createComment('no due cards');
  var p=el('<div class="panel"><div class="phead">'+
           '<h2><span class="dot" style="background:var(--warning)"></span>Dates landing soon</h2>'+
           '<span class="count">'+plural(list.length,'card')+'</span></div>'+
           '<div class="pbody"></div></div>');
  var body=p.querySelector('.pbody');
  list.forEach(function(c){
    var chip = c.overdue ? '<span class="chip hot">overdue '+Math.abs(c.days)+'d</span>'
             : c.days===0 ? '<span class="chip warn">due today</span>'
             : '<span class="chip warn">in '+c.days+'d</span>';
    body.appendChild(el(
      '<div class="row">'+
        '<div class="stripe" style="background:'+(c.overdue?'var(--critical)':'var(--warning)')+'"></div>'+
        '<div class="body">'+
          '<div class="top"><span class="title">'+
            (c.url?'<a href="'+esc(c.url)+'" target="_blank" rel="noopener">'+esc(c.name)+'</a>'
                  :esc(c.name))+'</span>'+
            '<span class="when">'+esc(new Date(c.due).toLocaleDateString(undefined,
              {month:'short',day:'numeric'}))+'</span></div>'+
          '<div class="meta">'+chip+' '+esc(c.board)+
            (c.list?' &middot; '+esc(c.list):'')+' &middot; '+esc(c.workspace)+'</div>'+
        '</div>'+
      '</div>'));
  });
  return p;
}

/* ---- monday ---- */
function mondayPanel(items){
  var p=el('<div class="panel"><div class="phead">'+
           '<h2><span class="dot" style="background:var(--s-monday)"></span>Monday</h2>'+
           '<span class="count">'+plural(items.length,'change')+'</span></div>'+
           '<div class="pbody"></div></div>');
  var body=p.querySelector('.pbody');
  if(!items.length){
    body.innerHTML='<p class="empty" style="padding:14px 0">No board activity in this week.</p>';
    return p;
  }
  var byBoard={};
  items.forEach(function(i){(byBoard[i.board]=byBoard[i.board]||[]).push(i);});
  Object.keys(byBoard).sort(function(a,b){return byBoard[b].length-byBoard[a].length;})
    .forEach(function(board){
      body.appendChild(el('<div class="grp">'+esc(board)+' &middot; '+
                          plural(byBoard[board].length,'change')+'</div>'));
      byBoard[board].slice(0,20).forEach(function(i){
        var cols = i.columns ? Object.keys(i.columns).map(function(k){
          return '<span class="chip">'+esc(i.columns[k])+'</span>';}).slice(0,4).join(' ') : '';
        var head = i.kind==='update'
          ? esc(i.author)+' commented on '+esc(i.name)
          : (i.is_new?'New: ':'Updated: ')+esc(i.name);
        body.appendChild(el(
          '<div class="row">'+
            '<div class="stripe" style="background:var(--s-monday)"></div>'+
            '<div class="body">'+
              '<div class="top"><span class="title">'+
                (i.url?'<a href="'+esc(i.url)+'" target="_blank" rel="noopener">'+head+'</a>':head)+
                '</span><span class="when">'+esc(when(i.when))+'</span></div>'+
              '<div class="meta">'+(i.group?esc(i.group)+' &middot; ':'')+
                esc(i.workspace||'')+' '+cols+'</div>'+
              (i.text?'<div class="snip">'+esc(i.text)+'</div>':'')+
            '</div>'+
          '</div>'));
      });
    });
  return p;
}

/* ---- trello ---- */
function trelloPanel(items){
  var p=el('<div class="panel"><div class="phead">'+
           '<h2><span class="dot" style="background:var(--s-trello)"></span>Trello</h2>'+
           '<span class="count">'+plural(items.length,'action')+'</span></div>'+
           '<div class="pbody"></div></div>');
  var body=p.querySelector('.pbody');
  if(!items.length){
    body.innerHTML='<p class="empty" style="padding:14px 0">No card activity in this week.</p>';
    return p;
  }
  var byBoard={};
  items.forEach(function(i){(byBoard[i.board]=byBoard[i.board]||[]).push(i);});
  Object.keys(byBoard).sort(function(a,b){return byBoard[b].length-byBoard[a].length;})
    .forEach(function(board){
      var ws=byBoard[board][0].workspace;
      body.appendChild(el('<div class="grp">'+esc(board)+
        (ws?' &middot; '+esc(ws):'')+' &middot; '+plural(byBoard[board].length,'action')+'</div>'));
      byBoard[board].slice(0,20).forEach(function(i){
        body.appendChild(el(
          '<div class="row">'+
            '<div class="stripe" style="background:var(--s-trello)"></div>'+
            '<div class="body">'+
              '<div class="top"><span class="title">'+
                (i.url?'<a href="'+esc(i.url)+'" target="_blank" rel="noopener">'+esc(i.text)+'</a>'
                      :esc(i.text))+
                '</span><span class="when">'+esc(when(i.when))+'</span></div>'+
              (i.comment?'<div class="snip">&ldquo;'+esc(i.comment)+'&rdquo;</div>':'')+
            '</div>'+
          '</div>'));
      });
    });
  return p;
}

/* ---- mail ---- */
function mailPanel(items){
  var inbound=items.filter(function(m){return !m.outbound;});
  var p=el('<div class="panel"><div class="phead">'+
           '<h2><span class="dot" style="background:var(--s-gmail)"></span>Inbox</h2>'+
           '<span class="count">'+plural(inbound.length,'email')+' received</span>'+
           '<span class="spacer"></span>'+
           '<button class="btn" type="button" data-more>Show all</button></div>'+
           '<div class="pbody"></div></div>');
  var body=p.querySelector('.pbody'), btn=p.querySelector('[data-more]');
  if(!inbound.length){
    body.innerHTML='<p class="empty" style="padding:14px 0">No mail received in this week.</p>';
    btn.remove(); return p;
  }
  var open=false;
  function draw(){
    body.innerHTML='';
    var byCat={};
    inbound.forEach(function(m){(byCat[m.category]=byCat[m.category]||[]).push(m);});
    Object.keys(byCat).sort(function(a,b){return byCat[b].length-byCat[a].length;})
      .forEach(function(cat){
        body.appendChild(el('<div class="grp">'+esc(cat)+' &middot; '+
                            plural(byCat[cat].length,'email')+'</div>'));
        byCat[cat].slice(0, open?999:4).forEach(function(m){
          body.appendChild(el(
            '<div class="row">'+
              '<div class="stripe" style="background:var(--s-gmail)"></div>'+
              '<div class="body">'+
                '<div class="top"><span class="title">'+esc(m.subject)+'</span>'+
                  '<span class="when">'+esc(when(m.when))+'</span></div>'+
                '<div class="meta">'+esc(m.from_name||m.from_addr)+' &middot; '+esc(m.from_addr)+
                  (m.needs_reply?' <span class="chip hot">needs reply</span>':'')+
                  (m.unread?' <span class="chip">unread</span>':'')+
                  (m.starred?' <span class="chip warn">starred</span>':'')+'</div>'+
                (m.snippet?'<div class="snip">'+esc(m.snippet)+'</div>':'')+
              '</div>'+
            '</div>'));
        });
        if(!open && byCat[cat].length>4)
          body.appendChild(el('<div class="grp" style="text-transform:none;letter-spacing:0">'+
            '+ '+(byCat[cat].length-4)+' more in '+esc(cat)+'</div>'));
      });
  }
  btn.addEventListener('click',function(){open=!open;btn.textContent=open?'Show less':'Show all';draw();});
  draw();
  return p;
}

/* ---- connections ---- */
function renderSrcs(){
  var host=document.getElementById('srcs'); host.innerHTML='';
  ['gmail','monday','trello'].forEach(function(k){
    var s=(DATA.sources||{})[k]||{};
    var state = s.status==='ok' ? {t:'Connected', c:'ok'}
              : s.status==='partial' ? {t:'Connected, partial', c:'warn'}
              : s.status==='no_token' ? {t:'Not connected yet', c:'warn'}
              : s.status==='missing' ? {t:'Never collected', c:'warn'}
              : {t:'Error', c:'hot'};
    var detail = (s.status==='ok'||s.status==='partial')
      ? plural(s.total||0,'item')+' in the last '+DATA.weeks.length+' weeks'+
        (s.skipped ? ' · '+plural(s.skipped,'board')+' unreadable' : '')
      : (s.error||'no detail');
    host.appendChild(el(
      '<div class="src">'+
        '<div class="n"><span class="dot" style="background:'+SRC[k].color+'"></span>'+
          SRC[k].label+'<span class="chip '+state.c+'" style="margin-left:auto">'+
          esc(state.t)+'</span></div>'+
        '<div class="s">'+esc(detail)+'</div>'+
        (s.collected_at?'<div class="s" style="color:var(--ink-3);margin-top:4px">last pull '+
          esc(clock(s.collected_at))+'</div>':'')+
        (s.status!=='ok'&&s.error?'<div class="e">'+esc(s.error)+'</div>':'')+
      '</div>'));
  });
}

})();
</script>
</body>
</html>
